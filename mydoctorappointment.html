<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body>     

    <h1> my doctor's appointment</h1>


    <p> fill in the form below to book your appointment. </p>
    
    <form>

        <fieldset>
          <legend>personal detail</legend>
          <LAbel>your name</LAbel>
          <input type="text" id="name" placeholder="enter your full name">

          <br>
          <br>
          <label> patient id</label><br>
          <input type="password" id="pid" placeholder="your secret id" <br><br>
          <label> date of birth</label><br>
          <input type="date" id="dob">  <br><br>

          </fieldset>
          <br><br>
        
          <fieldset>
            <legend> your visit</legend>
            <label> choose your doctor</label> 
           <select id="doctor">
              <option value="">-- select a doctor--</option>
              <option value="dr joe">Dr joe - general</option>
              <option value="dr joey">Dr joey - teeth</option>
              <option value="dr joe jr">Dr joe jr - eyes</option>
            </select> <br><br>
            <label> why are you visiting</label>
            <input type="radio" name="reason" value="fever">
            fever<br>
            <input type="radio" name="reason" value="checkup">checkup<br>
            <input type="radio" name="reason" value="cold">cold<br>
           <input type="radio" name="reason" value="tooth">toothpain<br>
           <label> any notes for the doctor </label><br>
           <textarea id="notes" rows="3" cols="35" placeholder="e.g. I have had a sore throat for 2 days."></textarea><br>

          </fieldset>
         


          <br>


          <fieldset>
        <legend> preferred visit day</legend>

        <input type="checkbox"  value="monday"> monday<br>
        <input type="checkbox"  value="tuesday"> tuesday<br>
        <input type="checkbox"  value="thursday"> thursday<br>
        <input type="checkbox"  value="wednesday"> wednesday<br>
 
</fieldset>
      <br>
      <input type="submit" value="book my appointment"

</form>
</body>
</html>
